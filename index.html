<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Words and Phrases</title>
    <style>
        :root {
            --primary-color: #2c221e;
            --accent-color: #8c6239;
            --bg-color: #dcd0c0;
            --parchment: #f4ebd0;
            --text-color: #3b2f2f;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--primary-color);
            color: var(--text-color);
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 800px;
            background-color: var(--bg-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .media-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .media-container img,
        .media-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .content-overlay {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            background: rgba(244, 235, 208, 0.85);
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            max-width: 80%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .nav-buttons {
            position: absolute;
            bottom: 20px;
            z-index: 10;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: var(--accent-color);
            color: var(--parchment);
            border: none;
            padding: 10px 20px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Media Container for Parchment & Videos -->
        <div class="media-container" id="mediaContainer">
            <!-- Dynamically injected via JavaScript -->
        </div>

        <!-- Text / Content Overlay -->
        <div class="content-overlay">
            <h1 id="blockTitle">Lost Words and Phrases</h1>
            <p id="blockText">Loading fragment...</p>
        </div>

        <!-- Navigation Controls -->
        <div class="nav-buttons">
            <button onclick="prevBlock()">Previous</button>
            <button onclick="nextBlock()">Next</button>
        </div>
    </div>

    <script>
        let currentBlockNum = 1;
        const totalBlocks = 18;

        // Example data array for the English content blocks
        const blocksData = {
            1: { title: "The Speaking Body", text: "Our body knows what we do not say, remembers what we forget, and sometimes, speaks what we conceal." },
            // Add remaining blocks data here up to 18 as needed
        };

        function renderCurrentHuella() {
            const mediaContainer = document.getElementById('mediaContainer');
            
            // Corrected file paths matching the _en suffix requirement
            const imgPath = `plantilla${currentBlockNum}_en.png`;
            const videoPath = `plantilla${currentBlockNum}_en_video.mp4`;

            mediaContainer.innerHTML = `
                <img src="${imgPath}" alt="Parchment Background ${currentBlockNum}" onerror="this.style.display='none'">
                <video autoplay muted loop playsinline>
                    <source src="${videoPath}" type="video/mp4">
                </video>
            `;

            // Update text content if available
            if (blocksData[currentBlockNum]) {
                document.getElementById('blockTitle').innerText = blocksData[currentBlockNum].title;
                document.getElementById('blockText').innerText = blocksData[currentBlockNum].text;
            } else {
                document.getElementById('blockTitle').innerText = `Fragment ${currentBlockNum}`;
                document.getElementById('blockText').innerText = "Text content for this section goes here.";
            }
        }

        function nextBlock() {
            currentBlockNum = currentBlockNum < totalBlocks ? currentBlockNum + 1 : 1;
            renderCurrentHuella();
        }

        function prevBlock() {
            currentBlockNum = currentBlockNum > 1 ? currentBlockNum - 1 : totalBlocks;
            renderCurrentHuella();
        }

        // Initialize on load
        window.onload = renderCurrentHuella;
    </script>
</body>
</html>
